[package]
name = "sandbox-targets"
version = "0.1.0"
edition = "2024"
description = "Plain std programs run under dowsing-sandbox (built with sancov flags by ../build-targets.sh)"

[dependencies]
dowsing-target-rt = { path = "../target-rt" }
libc = "0.2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1

[workspace]
